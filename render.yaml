services:
  - type: web
    name: myphysio-whatsapp-bot
    runtime: python
    plan: starter            # change to "free" if you want zero cost (data wiped on restart)
    region: singapore        # closest Render region to Delhi
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: appointments-disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_DEBUG
        value: "False"
      - key: APPOINTMENTS_FILE
        value: /var/data/appointments.json
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      # Set the rest in Render dashboard (so they don't live in git):
      #   TWILIO_ACCOUNT_SID
      #   TWILIO_AUTH_TOKEN
      #   TWILIO_WHATSAPP_NUMBER
      #   GOOGLE_CALENDAR_ID
      #   GOOGLE_CREDENTIALS_JSON   (paste the full JSON file contents)
      #   DOCTOR_EMAIL
      #   CLINIC_MEET_LINK
